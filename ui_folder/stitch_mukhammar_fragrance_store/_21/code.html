<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"secondary-fixed-dim":"#d3c2ca","on-background":"#1e1b1c","inverse-on-surface":"#f6eff0","surface-container-highest":"#e8e1e2","primary-fixed-dim":"#dfbdd2","on-tertiary-container":"#d2ddb9","on-primary-container":"#f1cee4","on-primary-fixed":"#291524","on-surface":"#1e1b1c","tertiary-container":"#586245","outline":"#7f747a","on-tertiary-fixed-variant":"#414a2f","tertiary-fixed":"#dce7c2","on-secondary-container":"#6c5f66","surface-container-high":"#eee6e8","on-error":"#ffffff","on-primary":"#ffffff","primary":"#583f50","secondary-fixed":"#f0dee6","on-secondary":"#ffffff","surface-container":"#f3eced","on-tertiary":"#ffffff","on-primary-fixed-variant":"#583f50","primary-container":"#715668","inverse-surface":"#332f31","surface-dim":"#dfd8da","error-container":"#ffdad6","on-tertiary-fixed":"#161e07","tertiary-fixed-dim":"#c0cba7","inverse-primary":"#dfbdd2","on-secondary-fixed":"#22191f","tertiary":"#414a2f","primary-fixed":"#fcd9ee","surface":"#fff7f9","on-surface-variant":"#4d4449","background":"#fff7f9","secondary-container":"#eddbe3","secondary":"#685b62","outline-variant":"#d0c3c9","surface-bright":"#fff7f9","surface-tint":"#715668","surface-variant":"#e8e1e2","surface-container-lowest":"#ffffff","on-error-container":"#93000a","on-secondary-fixed-variant":"#4f434a","surface-container-low":"#f9f2f3","error":"#ba1a1a"},"borderRadius":{"DEFAULT":"0.5rem","lg":"1rem","xl":"1.5rem","full":"9999px"},"fontFamily":{"headline":["Noto Sans Arabic"],"display":["Noto Sans Arabic"],"body":["Noto Sans Arabic"],"label":["Noto Sans Arabic"]}}}}</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;overflow-x:hidden;font-family:'Noto Sans Arabic',sans-serif;}body{overscroll-behavior:none;}}::-webkit-scrollbar{display:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom);}.pt-safe{padding-top:env(safe-area-inset-top);}</style></head><body class="bg-background text-on-background"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl"><div class="flex items-center h-16 px-4 justify-between"><button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><h1 class="text-[17px] font-semibold text-on-surface">Forgot Password</h1><div class="w-10"></div></div></header><main class="flex flex-col relative w-full pt-16"><div class="flex flex-col w-full h-full px-6 pt-8 pb-safe items-center bg-surface">
<div class="flex flex-col items-center w-full max-w-sm mt-8 space-y-8">
<div class="relative flex items-center justify-center w-32 h-32 rounded-full bg-surface-container-high shadow-sm overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 transition-opacity duration-500 ease-in-out group-hover:bg-primary/10"></div>
<span class="material-symbols-outlined text-[48px] text-primary transition-transform duration-500 ease-in-out group-hover:scale-110" style="font-variation-settings: &quot;FILL&quot; 1;">
        lock_reset
      </span>
<div class="absolute inset-0 rounded-full border border-primary/20 scale-[0.8] opacity-50 transition-transform duration-700 ease-out group-hover:scale-100 group-hover:opacity-100"></div>
</div>
<div class="flex flex-col items-center space-y-3 text-center">
<h2 class="text-[26px] font-semibold text-on-surface font-headline tracking-tight">نسيت كلمة المرور؟</h2>
<p class="text-[17px] text-on-surface-variant font-body leading-[28px] max-w-[280px]">
        أدخل بريدك الإلكتروني المسجل وسنرسل لك رمزاً لإعادة تعيين كلمة المرور.
      </p>
</div>
<div class="w-full space-y-6 mt-4">
<div class="relative group">
<label class="block text-[14px] font-medium text-on-surface-variant mb-2 mr-1" for="email">رقم الجوال</label>
<div class="relative flex items-center w-full h-14 bg-surface-container rounded-xl px-4 shadow-sm transition-shadow duration-300 focus-within:shadow-md focus-within:bg-surface-container-high">
<span class="material-symbols-outlined text-outline ml-3 transition-colors duration-300 group-focus-within:text-primary">phone_iphone</span>
<input autocomplete="tel" class="w-full h-full bg-transparent outline-none text-on-surface text-[17px] placeholder:text-outline-variant text-left dir-ltr font-body" id="email" inputmode="tel" placeholder="+966 5X XXX XXXX" type="tel">
</div>
</div>
<button class="relative overflow-hidden w-full h-14 bg-primary text-on-primary rounded-xl text-[17px] font-semibold flex items-center justify-center shadow-md active:scale-[0.98] transition-all duration-300" id="submitBtn">
<span class="relative z-10 flex items-center gap-2">
          إرسال الرمز
          <span class="material-symbols-outlined text-[20px] -scale-x-100" style="font-variation-settings: &quot;FILL&quot; 1;">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-white/20 opacity-0 transition-opacity duration-300 hover:opacity-100 active:opacity-30"></div>
</button>
</div>
</div>
</div>
<script>
  document.getElementById('submitBtn').addEventListener('click', function(e) {
    const btn = e.currentTarget;
    const originalText = btn.innerHTML;
    
    // Simple visual feedback for demonstration
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[24px]">progress_activity</span>`;
    btn.classList.add('opacity-90', 'pointer-events-none');
    
    setTimeout(() => {
      btn.innerHTML = `<span class="flex items-center gap-2"><span class="material-symbols-outlined text-[20px]">check</span> تم الإرسال</span>`;
      btn.classList.replace('bg-primary', 'bg-tertiary-container');
      btn.classList.replace('text-on-primary', 'text-on-tertiary-container');
      
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.classList.remove('opacity-90', 'pointer-events-none');
        btn.classList.replace('bg-tertiary-container', 'bg-primary');
        btn.classList.replace('text-on-tertiary-container', 'text-on-primary');
      }, 2000);
    }, 1500);
  });
</script></main>

</body></html>
