Family":{"headline-md":["IBM Plex Sans Arabic"],"label-md":["IBM Plex Sans Arabic"],"display-lg-mobile":["IBM Plex Sans Arabic"],"body-lg":["IBM Plex Sans Arabic"],"price-lg":["IBM Plex Sans Arabic"],"headline-sm":["IBM Plex Sans Arabic"],"body-md":["IBM Plex Sans Arabic"],"display-lg":["IBM Plex Sans Arabic"]},"fontSize":{"headline-md":["24px",{"lineHeight":"32px","fontWeight":"500"}],"label-md":["14px",{"lineHeight":"20px","letterSpacing":"0.02em","fontWeight":"500"}],"display-lg-mobile":["32px",{"lineHeight":"40px","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"price-lg":["22px",{"lineHeight":"28px","fontWeight":"600"}],"headline-sm":["20px",{"lineHeight":"28px","fontWeight":"500"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"display-lg":["42px",{"lineHeight":"52px","fontWeight":"600"}]}}}}</script></head><body class="bg-surface text-on-surface font-body-md"><main class="flex flex-col relative w-full min-h-screen"><div class="flex flex-col w-full h-full min-h-[100dvh] bg-surface items-center justify-center relative overflow-hidden px-container-margin py-section-gap">
<!-- Subtle ambient background elements -->
<div class="absolute inset-0 pointer-events-none opacity-30 z-0 flex justify-center items-center">
<div class="w-[80vw] h-[80vw] rounded-full bg-gradient-to-br from-primary-fixed/20 to-transparent blur-3xl absolute -top-[20vw] -left-[20vw]"></div>
<div class="w-[60vw] h-[60vw] rounded-full bg-gradient-to-tl from-secondary-fixed/20 to-transparent blur-3xl absolute -bottom-[10vw] -right-[10vw]"></div>
</div>
<!-- Main Content Container -->
<div class="w-full max-w-md flex flex-col z-10 items-center">
<!-- Logo Header -->
<div class="w-32 h-32 mb-stack-lg rounded-full overflow-hidden shadow-[0_10px_30px_rgba(130,115,123,0.08)]">
<img alt="Mukhamar Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1UR6XlRnLpK-klCSKvhXqFgJmQmNzH5UHpCyJ9BH3HvdlYYe61LrUobZAcGHKcjsMsPaM2R6RegAXA7SK_-LHHgm4zD30KtQWd77ioIZHLJESY2FDlkNoJYZc1Hct2LAfGdeDUz5BK0T7Sjf3NqSlr7uEQ-uZWMeGDB8guhCZti2qnQraC2GgqQoelhPBgRMhGvbfhdFxjfrIvRzJGZghCl6fr2Tu3dci8wV5DaYMv5MKg6lDm4MwUMTO_O"/>
</div>
<div class="text-center mb-section-gap">
<h1 class="font-display-lg-mobile text-on-surface mb-stack-sm">أهلاً بك مجدداً</h1>
<p class="font-body-lg text-on-surface-variant">سجل دخولك لاكتشاف عالم العطور الفاخرة</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-stack-lg" onsubmit="event.preventDefault();">
<!-- Input Group: Email/Phone -->
<div class="flex flex-col gap-stack-sm w-full">
<label class="font-label-md text-on-surface ml-2" for="identifier">البريد الإلكتروني أو رقم الجوال</label>
<div class="relative flex items-center bg-surface-container rounded-lg shadow-sm focus-within:shadow-md transition-shadow duration-300">
<span class="material-symbols-outlined absolute right-4 text-on-surface-variant z-10 pointer-events-none" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-transparent font-body-md text-on-surface placeholder:text-outline py-4 pr-12 pl-4 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary/50 transition-all" dir="rtl" id="identifier" name="identifier" placeholder="أدخل بريدك أو رقمك" type="text"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-stack-sm w-full">
<label class="font-label-md text-on-surface ml-2" for="password">كلمة المرور</label>
<div class="relative flex items-center bg-surface-container rounded-lg shadow-sm focus-within:shadow-md transition-shadow duration-300">
<span class="material-symbols-outlined absolute right-4 text-on-surface-variant z-10 pointer-events-none" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-transparent font-body-md text-on-surface placeholder:text-outline py-4 pr-12 pl-12 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary/50 transition-all" dir="rtl" id="password" name="password" placeholder="أدخل كلمة المرور" type="password"/>
<button class="absolute left-4 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="visibility-icon" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end w-full -mt-stack-md">
<a class="font-label-md text-secondary hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary/30 rounded px-1" href="#">نسيت كلمة المرور؟</a>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-stack-md w-full mt-stack-md">
<button class="w-full bg-primary text-on-primary font-headline-sm py-4 px-8 rounded-lg shadow-md hover:bg-on-primary-fixed-variant active:bg-primary-container transition-colors focus:outline-none focus:ring-4 focus:ring-primary/20 flex justify-center items-center gap-2 group" type="submit">
<span>تسجيل الدخول</span>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 -translate-x-2 group-hover:translate-x-0 transition-all duration-300" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<button class="w-full bg-transparent border-[1.5px] border-outline text-outline font-headline-sm py-4 px-8 rounded-lg hover:bg-surface-container-low hover:text-primary hover:border-primary transition-colors focus:outline-none focus:ring-4 focus:ring-outline/20 mt-stack-sm" type="button">
          إنشاء حساب جديد
        </button>
</div>
</form>
<!-- Footer / Decorative -->
<div class="mt-section-gap flex items-center justify-center gap-4 opacity-50 w-full">
<div class="h-[1px] bg-outline flex-1"></div>
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0; font-size: 16px;">spa</span>
<div class="h-[1px] bg-outline flex-1"></div>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const visibilityIcon = document.getElementById('visibility-icon');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      visibilityIcon.textContent = 'visibility';
    } else {
      passwordInput.type = 'password';
      visibilityIcon.textContent = 'visibility_off';
    }
  }
</script></main></body></html>
