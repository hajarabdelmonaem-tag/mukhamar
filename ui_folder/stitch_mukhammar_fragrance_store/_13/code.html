</head><body class="bg-surface text-on-surface font-body-md"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-14 px-container-margin flex items-center gap-4"><button class="w-10 h-10 flex items-center justify-center text-on-surface rounded-full" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><span class="font-headline-sm text-headline-sm">Register</span></div></header><main class="flex flex-col relative w-full pt-14 bg-surface min-h-screen"><div class="flex flex-col w-full relative min-h-full pb-8">
<div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-variant/30 opacity-70 pointer-events-none"></div>
<div class="px-container-margin relative z-10 pt-6">
<div class="flex flex-col items-center mb-section-gap">
<div class="w-20 h-20 mb-stack-lg rounded-full overflow-hidden flex items-center justify-center shadow-lg bg-surface-container">
<img class="w-full h-full object-cover" data-alt="Close up of a luxurious crystal perfume bottle, elegant lighting, soft shadows, warm muted tones, hinting at heritage and high end craftsmanship" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCY8ffHaBE9tndesH1AdkYezx6RZx1W54jVZ-T-eLGP4NkftgGHjo8ohgy2DFeLwWcHWR_CdlzaGqPt5gObaStNJRjJHF3ATSwr-uxu2BzWWs_D97JxdX8KalUSv9mlNOsevyRmuyCbenojDQFGrMDA3l3kPGu1vaRALE6-nhSDhc7ltb_4thtEiS47KdASj6zIaXF-bgZT6InJdJlpKW0OFlRabUIq9VBunRM55mYzIknwRlazXSAigA"/>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface text-center mb-stack-sm tracking-tight">انضم إلينا</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[280px]">اكتشف عالم العطور الفاخرة وابدأ رحلتك معنا</p>
</div>
<form class="flex flex-col gap-stack-lg" id="registrationForm" onsubmit="event.preventDefault(); window.location.href='#';">
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="fullName">الاسم الكامل</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface-container-highest text-on-surface font-body-md text-body-md rounded-xl px-4 pl-12 focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline-variant" id="fullName" placeholder="أدخل اسمك الكريم" type="text"/>
<span class="material-symbols-outlined absolute left-4 text-outline pointer-events-none text-[20px]">person</span>
</div>
</div>
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">البريد الإلكتروني</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface-container-highest text-on-surface font-body-md text-body-md rounded-xl px-4 pl-12 focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline-variant text-left" dir="ltr" id="email" placeholder="example@domain.com" type="email"/>
<span class="material-symbols-outlined absolute left-4 text-outline pointer-events-none text-[20px]">mail</span>
</div>
</div>
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="phone">رقم الجوال</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface-container-highest text-on-surface font-body-md text-body-md rounded-xl px-4 pl-12 focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline-variant text-left" dir="ltr" id="phone" placeholder="+966 5X XXX XXXX" type="tel"/>
<span class="material-symbols-outlined absolute left-4 text-outline pointer-events-none text-[20px]">call</span>
</div>
</div>

<button class="absolute left-4 text-outline flex items-center justify-center p-1" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibilityIcon">visibility_off</span>
</button>
</div>
</div>
<label class="flex items-start gap-3 mt-2 cursor-pointer group">

<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity scale-50 peer-checked:scale-100 duration-200">check</span>
</div>
</div>

</span>
</label>
<button class="w-full h-14 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-xl mt-6 shadow-md shadow-primary/20 hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group overflow-hidden relative" type="submit">
<span class="relative z-10">إنشاء حساب</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
</button>
</form>
<div class="mt-section-gap flex justify-center pb-8">
<p class="font-body-md text-body-md text-on-surface-variant">
        لديك حساب بالفعل؟ 
        <a class="text-primary font-headline-sm text-headline-sm mr-1 hover:underline underline-offset-4" href="#">تسجيل الدخول</a>
</p>
</div>
</div>
<script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const visibilityIcon = document.getElementById('visibilityIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        visibilityIcon.textContent = 'visibility';
      } else {
        passwordInput.type = 'password';
        visibilityIcon.textContent = 'visibility_off';
      }
    }

    // Add delicate interaction to inputs
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.parentElement.classList.add('-translate-y-1');
        this.parentElement.parentElement.style.transition = 'transform 0.3s ease';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.parentElement.classList.remove('-translate-y-1');
      });
    });
  </script>
