<!DOCTYPE html>

<html dir="rtl" lang="ar"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300,0..1&amp;display=swap" rel="stylesheet"/>
<style>
@layer base {
  html, body { width: 100vw; margin: 0; padding: 0; overflow-x: hidden; }
  body { overscroll-behavior: none; }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
  .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
}
::-webkit-scrollbar { display: none; }
.pattern-bg {
  background-image: radial-gradient(circle at 100% 0%, var(--tw-gradient-from) 0%, transparent 50%), radial-gradient(circle at 0% 100%, var(--tw-gradient-to) 0%, transparent 50%);
}
@keyframes success-pop {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes pulse-ring {
  0% { transform: scale(0.9); opacity: 0.5; }
  100% { transform: scale(1.3); opacity: 0; }
}
.animate-success {
  animation: success-pop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.animate-ring {
  animation: pulse-ring 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
}
</style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "secondary": "#685b62",
                "on-primary": "#ffffff",
                "tertiary": "#586245",
                "surface-bright": "#fff8f8",
                "surface-container-lowest": "#ffffff",
                "surface-dim": "#dfd8d9",
                "on-secondary-fixed-variant": "#50434a",
                "on-error-container": "#93000a",
                "primary-fixed-dim": "#dfbdd2",
                "tertiary-fixed": "#dce7c2",
                "inverse-primary": "#dfbdd2",
                "surface-container-high": "#eee6e7",
                "surface-container-highest": "#e8e1e2",
                "surface-container": "#f4eced",
                "secondary-container": "#f1dde7",
                "background": "#fff8f8",
                "surface": "#fff8f8",
                "on-tertiary-fixed-variant": "#404a2f",
                "on-tertiary": "#ffffff",
                "tertiary-fixed-dim": "#c0cba7",
                "surface-variant": "#e8e1e2",
                "on-surface-variant": "#4d4449",
                "outline": "#7f747a",
                "on-tertiary-container": "#242d14",
                "inverse-surface": "#332f30",
                "outline-variant": "#d0c3c9",
                "surface-tint": "#715668",
                "on-secondary-container": "#6f6068",
                "secondary-fixed-dim": "#d4c2cb",
                "on-primary-fixed": "#291524",
                "secondary-fixed": "#f1dde7",
                "error": "#ba1a1a",
                "inverse-on-surface": "#f6eff0",
                "on-tertiary-fixed": "#161e07",
                "on-secondary": "#ffffff",
                "primary-fixed": "#fcd9ee",
                "error-container": "#ffdad6",
                "primary-container": "#a7889c",
                "on-background": "#1e1b1c",
                "tertiary-container": "#8a9574",
                "on-error": "#ffffff",
                "on-primary-fixed-variant": "#583f50",
                "primary": "#715668",
                "surface-container-low": "#f9f2f3",
                "on-secondary-fixed": "#23191f",
                "on-primary-container": "#392333",
                "on-surface": "#1e1b1c"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "stack-sm": "4px",
                "stack-md": "12px",
                "gutter": "16px",
                "section-gap": "48px",
                "stack-lg": "24px",
                "unit": "8",
                "container-margin": "24px"
        },
        "fontFamily": {
                "body-lg": ["IBM Plex Sans Arabic"],
                "headline-sm": ["IBM Plex Sans Arabic"],
                "headline-md": ["IBM Plex Sans Arabic"],
                "price-lg": ["IBM Plex Sans Arabic"],
                "label-md": ["IBM Plex Sans Arabic"],
                "body-md": ["IBM Plex Sans Arabic"],
                "display-lg": ["IBM Plex Sans Arabic"],
                "display-lg-mobile": ["IBM Plex Sans Arabic"]
        },
        "fontSize": {
                "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                "price-lg": ["22px", {"lineHeight": "28px", "fontWeight": "600"}],
                "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                "display-lg": ["42px", {"lineHeight": "52px", "fontWeight": "600"}],
                "display-lg-mobile": ["32px", {"lineHeight": "40px", "fontWeight": "600"}]
        }
      }
    }
  }
</script>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-[100dvh] flex flex-col pt-safe pb-safe from-primary-fixed/20 to-surface-container-high/30 pattern-bg relative">
<main class="flex flex-col flex-1 relative w-full h-full px-container-margin z-10 justify-between py-8">
<div class="flex flex-col items-center pt-8">
<!-- Success Indicator -->
<div class="relative flex items-center justify-center mb-10 animate-success">
<div class="absolute inset-0 rounded-full border border-primary/20 animate-ring"></div>
<div class="absolute inset-2 rounded-full border border-primary/10 animate-ring" style="animation-delay: 0.5s;"></div>
<div class="w-24 h-24 rounded-full bg-primary-container/30 flex items-center justify-center relative z-10 backdrop-blur-sm">
<div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-on-primary text-[40px]">check</span>
</div>
</div>
</div>
<!-- Headers -->
<div class="text-center space-y-stack-sm mb-section-gap">
<h1 class="font-display-lg-mobile text-primary">تم طلبك بنجاح</h1>
<p class="font-body-lg text-on-surface-variant max-w-[280px] mx-auto">
          شكراً لتسوقك معنا. عبقك في الطريق إليك.
        </p>
</div>
<!-- Order Summary Card -->
<div class="w-full bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/30 overflow-hidden">
<!-- Order Details -->
<div class="p-gutter flex flex-col gap-stack-lg">
<div class="flex items-center justify-between">
<div class="flex flex-col gap-1">
<span class="font-label-md text-on-surface-variant">رقم الطلب</span>
<span class="font-headline-sm text-on-surface font-semibold tracking-wider">#MK1048</span>
</div>
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined">receipt_long</span>
</div>
</div>
<hr class="border-outline-variant/30"/>
<div class="flex items-center justify-between">
<div class="flex flex-col gap-1">
<span class="font-label-md text-on-surface-variant">طريقة الدفع</span>
<span class="font-body-lg text-on-surface flex items-center gap-2">
                Apple Pay
                <span class="material-symbols-outlined text-[20px] text-on-surface-variant">account_balance_wallet</span>
</span>
</div>
<div class="flex flex-col gap-1 text-left" dir="ltr">
<span class="font-label-md text-on-surface-variant text-right">الإجمالي</span>
<span class="font-price-lg text-primary">378 ر.س</span>
</div>
</div>
</div>
<!-- Estimated Delivery -->
<div class="bg-surface-container/50 px-gutter py-stack-md border-t border-outline-variant/30 flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined text-[20px]">local_shipping</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-on-surface-variant">موعد التوصيل المتوقع</span>
<span class="font-body-md text-on-surface font-medium">سيصلك خلال ٢-٤ أيام</span>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-stack-md mt-auto pt-8">
<button class="w-full h-[56px] bg-primary text-on-primary rounded-xl font-headline-sm flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
        تتبع الطلب
        <span class="material-symbols-outlined">arrow_back</span>
</button>
<button class="w-full h-[56px] bg-transparent border-2 border-primary text-primary rounded-xl font-headline-sm flex items-center justify-center active:bg-primary/5 transition-colors">
        العودة للرئيسية
      </button>
</div>
</main>
</body></html>
