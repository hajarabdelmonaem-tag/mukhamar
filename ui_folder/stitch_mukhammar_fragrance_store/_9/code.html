rgin":"24px","section-gap":"48px","stack-sm":"4px","gutter":"16px","stack-lg":"24px","stack-md":"12px"},"fontFamily":{"display-lg":["IBM Plex Sans Arabic"],"body-lg":["IBM Plex Sans Arabic"],"body-md":["IBM Plex Sans Arabic"],"display-lg-mobile":["IBM Plex Sans Arabic"],"headline-sm":["IBM Plex Sans Arabic"],"label-md":["IBM Plex Sans Arabic"],"headline-md":["IBM Plex Sans Arabic"],"price-lg":["IBM Plex Sans Arabic"]},"fontSize":{"display-lg":["42px",{"lineHeight":"52px","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"display-lg-mobile":["32px",{"lineHeight":"40px","fontWeight":"600"}],"headline-sm":["20px",{"lineHeight":"28px","fontWeight":"500"}],"label-md":["14px",{"lineHeight":"20px","letterSpacing":"0.02em","fontWeight":"500"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"500"}],"price-lg":["22px",{"lineHeight":"28px","fontWeight":"600"}]}}}}</script></head><body class="bg-surface text-on-surface font-body-md pt-safe pb-safe min-h-screen"><main class="flex flex-col relative w-full h-full"><div class="flex flex-col w-full relative bg-surface" dir="rtl">
<!-- Progress Indicator -->
<div class="px-container-margin py-stack-md bg-surface-container-lowest shadow-sm z-10 sticky top-0">
<div class="flex items-center justify-between relative">
<div aria-hidden="true" class="absolute inset-y-0 right-0 left-0 flex items-center z-0">
<div class="h-[1px] w-full bg-outline-variant"></div>
</div>
<div class="flex flex-col items-center gap-stack-sm z-10 bg-surface-container-lowest px-2">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-on-primary">check</span>
</div>
<span class="font-label-md text-on-surface-variant text-[10px]">الشحن</span>
</div>
<div class="flex flex-col items-center gap-stack-sm z-10 bg-surface-container-lowest px-2">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center shadow-[0_0_10px_rgba(113,86,104,0.3)]">
<div class="w-2 h-2 rounded-full bg-on-primary"></div>
</div>
<span class="font-label-md text-primary text-[10px] font-bold">الدفع</span>
</div>
<div class="flex flex-col items-center gap-stack-sm z-10 bg-surface-container-lowest px-2">
<div class="w-6 h-6 rounded-full border border-outline-variant bg-surface flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-surface-dim"></div>
</div>
<span class="font-label-md text-outline text-[10px]">التأكيد</span>
</div>
</div>
</div>
<!-- Main Content -->
<div class="flex-1 overflow-y-auto px-container-margin py-stack-lg flex flex-col gap-section-gap">
<!-- Payment Methods -->
<section class="flex flex-col gap-stack-lg">
<h2 class="font-headline-sm text-on-surface">طريقة الدفع</h2>
<div class="flex flex-col gap-stack-md" id="payment-methods">
<!-- Apple Pay -->

<!-- Credit/Debit Card -->
<label class="relative flex flex-col p-4 rounded-xl bg-surface-container shadow-sm cursor-pointer transition-all duration-300" onclick="selectPayment(this, true)">
<input checked="" class="peer sr-only" name="payment" type="radio" value="card">
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-4">
<div class="flex gap-1">
<div class="w-8 h-5 bg-surface-dim rounded shadow-sm flex items-center justify-center text-[8px] font-bold text-on-surface-variant">VISA</div>
<div class="w-8 h-5 bg-surface-dim rounded shadow-sm flex items-center justify-center text-[8px] font-bold text-on-surface-variant">MADA</div>
</div>
<span class="font-body-md text-on-surface">البطاقة الائتمانية / مدى</span>
</div>
<div class="w-5 h-5 rounded-full border-[1.5px] border-outline peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-on-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</div>
<div class="absolute inset-0 rounded-xl border-[1.5px] border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
<!-- Card Details Form (Expandable) -->
<div class="overflow-hidden max-h-0 opacity-0 peer-checked:max-h-[300px] peer-checked:opacity-100 peer-checked:mt-4 transition-all duration-500 ease-in-out w-full flex flex-col gap-stack-md" id="card-form">
<div class="relative">
<input class="w-full bg-surface text-on-surface font-body-md p-4 rounded-lg outline-none placeholder:text-outline shadow-inner focus:ring-1 focus:ring-primary transition-shadow" id="cardName" placeholder="الاسم على البطاقة" required="" type="text">
</div>
<div class="relative">
<input class="w-full bg-surface text-on-surface font-body-md p-4 rounded-lg outline-none placeholder:text-outline shadow-inner focus:ring-1 focus:ring-primary transition-shadow text-left dir-ltr" id="cardNumber" inputmode="numeric" maxlength="19" oninput="formatCardNumber(this)" placeholder="0000 0000 0000 0000" required="" type="text">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">credit_card</span>
</div>
<div class="flex gap-stack-md w-full">
<div class="relative flex-1">
<input class="w-full bg-surface text-on-surface font-body-md p-4 rounded-lg outline-none placeholder:text-outline shadow-inner focus:ring-1 focus:ring-primary transition-shadow text-center dir-ltr" id="cardExpiry" maxlength="5" oninput="formatExpiry(this)" placeholder="MM/YY" required="" type="text">
</div>
<div class="relative flex-1">
<input class="w-full bg-surface text-on-surface font-body-md p-4 rounded-lg outline-none placeholder:text-outline shadow-inner focus:ring-1 focus:ring-primary transition-shadow text-center dir-ltr" id="cardCvv" inputmode="numeric" maxlength="4" placeholder="CVV" required="" type="password">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[18px]">info</span>
</div>
</div>
</div>
</label>
<!-- Installments -->

</div>
</section>
<!-- Security Badge -->
<div class="flex items-center justify-center gap-2 py-2">
<span class="material-symbols-outlined text-tertiary-container text-[20px]">lock</span>
<span class="font-label-md text-on-surface-variant">معلومات الدفع الخاصة بك مشفرة وآمنة</span>
</div>
<!-- Order Summary -->
<section class="flex flex-col gap-stack-md bg-surface-container-low p-6 rounded-2xl shadow-sm relative overflow-hidden">
<div class="absolute -right-6 -top-6 w-24 h-24 bg-primary-fixed rounded-full blur-2xl opacity-40"></div>
<h3 class="font-headline-sm text-on-surface mb-2 relative z-10">ملخص الطلب</h3>
<div class="flex justify-between items-center relative z-10">
<span class="font-body-md text-on-surface-variant">المجموع الفرعي (3 منتجات)</span>
<span class="font-price-lg text-on-surface" style="font-size: 16px;">١٢٥٠ ر.س</span>
</div>
<div class="flex justify-between items-center relative z-10">
<span class="font-body-md text-on-surface-variant">الشحن</span>
<span class="font-price-lg text-primary" style="font-size: 16px;">مجانًا</span>
</div>
<div class="flex justify-between items-center relative z-10">
<span class="font-body-md text-on-surface-variant">الضريبة (15%)</span>
<span class="font-price-lg text-on-surface" style="font-size: 16px;">١٨٧ ر.س</span>
</div>
<div class="h-[1px] w-full bg-outline-variant my-2 relative z-10"></div>
<div class="flex justify-between items-end relative z-10">
<span class="font-headline-md text-on-surface">الإجمالي</span>
<div class="flex items-baseline gap-1">
<span class="font-price-lg text-on-surface text-[24px]">١٤٣٧</span>
<span class="font-label-md text-on-surface-variant">ر.س</span>
</div>
</div>
</section>
<!-- Spacer for Bottom Navigation -->
<div class="h-24"></div>
</div>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 right-0 p-container-margin bg-surface-container-lowest/90 backdrop-blur-md shadow-[0_-10px_30px_rgba(113,86,104,0.05)] z-20 pb-[max(env(safe-area-inset-bottom),24px)] rounded-t-3xl">
<button class="w-full bg-primary text-on-primary py-4 px-8 rounded-xl font-headline-sm flex items-center justify-center gap-3 transition-colors hover:bg-on-primary-fixed active:scale-[0.98]" id="payButton" onclick="processPayment(this)">
<span class="">الدفع بواسطة Apple Pay</span>
<span class="font-price-lg">١٤٣٧ ر.س</span>
<span class="material-symbols-outlined mr-auto rotate-180">arrow_right_alt</span>
</button>
</div>
</div>
<script>
    // Format Card Number (space every 4 digits)
    function formatCardNumber(input) {
        let val = input.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        let matches = val.match(/\d{4,16}/g);
        let match = matches && matches[0] || '';
        let parts = [];
        
        for (let i = 0, len = match.length; i < len; i += 4) {
            parts.push(match.substring(i, i + 4));
        }
        
        if (parts.length) {
            input.value = parts.join(' ');
        } else {
            input.value = val;
        }
    }

    // Format Expiry Date (MM/YY)
    function formatExpiry(input) {
        let val = input.value.replace(/\D/g, '');
        if (val.length > 2) {
            val = val.substring(0, 2) + '/' + val.substring(2, 4);
        }
        input.value = val;
    }

    // Handle Payment Selection styling
    function selectPayment(element, isCard = false) {
        // Reset scale on all
        document.querySelectorAll('#payment-methods > label').forEach(el => {
            el.classList.remove('scale-[1.01]', 'shadow-md');
        });
        
        // Add active style to selected
        element.classList.add('scale-[1.01]', 'shadow-md');
        
        // Update button text based on selection if needed
        const btn = document.getElementById('payButton');
        const radio = element.querySelector('input[type="radio"]');
        
        if(radio.value === 'applepay') {
             btn.querySelector('span:first-child').innerText = 'الدفع بواسطة Apple Pay';
        } else {
             btn.querySelector('span:first-child').innerText = 'إتمام الدفع';
        }
    }

    // Simulate Payment Processing
    function processPayment(btn) {
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span><span class="font-headline-sm">جاري المعالجة...</span>';
        btn.disabled = true;
        btn.classList.add('opacity-80', 'cursor-not-allowed');

        // Check if card is selected and validate simple rules
        const cardRadio = document.querySelector('input[value="card"]');
        if(cardRadio && cardRadio.checked) {
            const num = document.getElementById('cardNumber').value.length;
            if(num < 19) { // 16 digits + 3 spaces
                 setTimeout(() => {
                    btn.innerHTML = '<span class="material-symbols-outlined">error</span><span class="font-headline-sm">تأكد من رقم البطاقة</span>';
                    btn.classList.replace('bg-primary', 'bg-error');
                    
                    setTimeout(() => {
                        btn.innerHTML = originalHtml;
                        btn.disabled = false;
                        btn.classList.remove('opacity-80', 'cursor-not-allowed');
                        btn.classList.replace('bg-error', 'bg-primary');
                    }, 2000);
                 }, 800);
                 return;
            }
        }

        setTimeout(() => {
            btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span class="font-headline-sm">تم الدفع بنجاح</span>';
            btn.classList.replace('bg-primary', 'bg-[#8a9574]'); // Using tertiary-container for success
            
            // Trigger a subtle confetti or page transition here in real app
        }, 2000);
    }
</script></main>
